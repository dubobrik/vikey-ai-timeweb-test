name: Build SEO business page branch

on:
  push:
    branches:
      - seo-sayty-dlya-biznesa
    paths:
      - .github/workflows/build-seo-business-page-branch.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: seo-sayty-dlya-biznesa
          fetch-depth: 0

      - name: Patch main service card and sitemap
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src/routes/index.tsx")
          text = p.read_text(encoding="utf-8")

          old_type = "const services = ["
          new_type = "const services: { title: string; desc: string; icon: string; href?: string }[] = ["
          if old_type in text:
              text = text.replace(old_type, new_type, 1)
          elif new_type not in text:
              raise SystemExit("services array marker mismatch")

          old_service = '  { title: "Сайты и лендинги с AI", desc: "Быстрая разработка сайтов с использованием AI-генерации." , icon: "▲" },'
          new_service = '  { title: "Сайты для бизнеса", desc: "Сайты и лендинги под задачу бизнеса: структура, мобильная адаптация, визуальная упаковка и SEO-подготовка.", icon: "▲", href: "/sayty-dlya-biznesa/" },'
          if old_service in text:
              text = text.replace(old_service, new_service, 1)
          elif new_service not in text:
              raise SystemExit("site service card marker mismatch")

          old_render = '              <p className="mt-2 text-sm text-muted-foreground">{s.desc}</p>\n            </div>'
          new_render = '              <p className="mt-2 text-sm text-muted-foreground">{s.desc}</p>\n              {s.href ? (\n                <a href={s.href} className="mt-4 inline-flex text-sm font-semibold text-neon transition hover:text-neon/80">\n                  Подробнее →\n                </a>\n              ) : null}\n            </div>'
          if old_render in text:
              text = text.replace(old_render, new_render, 1)
          elif new_render not in text:
              raise SystemExit("services render marker mismatch")

          p.write_text(text, encoding="utf-8")

          sitemap = Path("public/sitemap.xml")
          sm = sitemap.read_text(encoding="utf-8")
          new_url = "https://chelovek-neiroset.ru/sayty-dlya-biznesa/"
          if new_url not in sm:
              marker = "</urlset>"
              if sm.count(marker) != 1:
                  raise SystemExit("sitemap closing marker mismatch")
              block = f"  <url>\n    <loc>{new_url}</loc>\n  </url>\n"
              sm = sm.replace(marker, block + marker, 1)
              sitemap.write_text(sm, encoding="utf-8")
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f .output/public/sayty-dlya-biznesa/index.html
          grep -Fq 'Создание сайтов для бизнеса под ключ' .output/public/sayty-dlya-biznesa/index.html
          grep -Fq 'https://chelovek-neiroset.ru/sayty-dlya-biznesa/' .output/public/sayty-dlya-biznesa/index.html
          grep -Fq 'index,follow' .output/public/sayty-dlya-biznesa/index.html
          test "$(grep -c '<loc>' public/sitemap.xml)" -eq 3
          grep -Fq '<loc>https://chelovek-neiroset.ru/sayty-dlya-biznesa/</loc>' public/sitemap.xml
          grep -Fq 'Sitemap: https://chelovek-neiroset.ru/sitemap.xml' public/robots.txt

      - name: Commit generated and patched files, remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build-seo-business-page-branch.yml
          git add src/routes/index.tsx src/routeTree.gen.ts public/sitemap.xml
          git commit -m "Complete SEO business page integration"
          git push origin seo-sayty-dlya-biznesa
