name: Temporary stone case strict live audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vikey-stone-live-temp.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary Playwright
        id: install
        continue-on-error: true
        run: |
          npm install --prefix /tmp/vikey-browser --no-save playwright
          /tmp/vikey-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run live audit
        id: audit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          NODE_PATH: /tmp/vikey-browser/node_modules
        run: node .github/vikey-stone-live-temp.cjs
      - name: Save results
        if: always()
        run: |
          if [ ! -f .github/vikey-stone-live-report-temp.json ]; then
            printf '{"passed":false,"errors":["Audit produced no report"]}\n' > .github/vikey-stone-live-report-temp.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/vikey-stone-live-report-temp.json
          git commit -m "Temporary stone case live audit report"
          git push origin HEAD:main
      - name: Fail if audit incomplete
        if: always()
        run: |
          node -e "const r=require('./.github/vikey-stone-live-report-temp.json');if(!r.passed)process.exit(1)"
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
