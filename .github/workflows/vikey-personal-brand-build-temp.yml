name: Temporary personal brand case build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vikey-personal-brand-build-temp.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Production build and route verification
        run: |
          bun run build
          grep -Fq '/case-sayt-lichnogo-brenda' src/routeTree.gen.ts
          test "$(grep -c '<loc>' public/sitemap.xml)" -eq 14
          ! grep -q -E 'vite-plugin-pwa|workbox' package.json
      - name: Save only generated route
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routeTree.gen.ts
            git commit -m "Generate route tree for personal brand case"
            git push origin HEAD:main
          fi
