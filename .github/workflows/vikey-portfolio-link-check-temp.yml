name: Temporary portfolio link verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vikey-portfolio-link-check-temp.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Check source and production build
        id: verify
        continue-on-error: true
        run: |
          bun install --frozen-lockfile
          bun run build
          grep -Fq 'viewHref: "https://www.savanadivik.ru/"' src/routes/index.tsx
          ! grep -Fq 'viewHref: "https://savanadivik.ru/"' src/routes/index.tsx
          test "$(grep -c '<loc>' public/sitemap.xml)" -eq 16
      - name: Save build result
        if: always()
        run: |
          if [ "${{ steps.verify.outcome }}" = "success" ]; then
            echo '{"passed":true,"productionBuild":"success"}' > .github/vikey-portfolio-link-check-result-temp.json
          else
            echo '{"passed":false,"productionBuild":"failed"}' > .github/vikey-portfolio-link-check-result-temp.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/vikey-portfolio-link-check-result-temp.json
          git commit -m "Temporary portfolio link verification result"
          git push origin HEAD:main
      - name: Strict build status
        if: always()
        run: test "${{ steps.verify.outcome }}" = "success"
