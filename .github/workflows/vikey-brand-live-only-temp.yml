name: Temporary strict personal-brand live SEO only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vikey-brand-live-only-temp.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check live page metadata and sitemap
        id: audit
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, re
          from html.parser import HTMLParser
          from datetime import datetime, timezone
          base="https://chelovek-neiroset.ru"
          url=base+"/case-sayt-lichnogo-brenda/"
          expected={"title":"Создание сайта для личного бренда — кейс Vikey AI","description":"Кейс Vikey AI: создание сайта для личного бренда на примере проекта личных консультаций. Структура, атмосферная визуальная подача, услуги, мобильная версия и контакты.","canonical":url,"h1":"Создание сайта для личного бренда"}
          report={"timestamp":datetime.now(timezone.utc).isoformat(),"checks":{},"errors":[]}
          def record(name,actual,wanted):
              report["checks"][name]={"passed":actual==wanted,"actual":actual,"expected":wanted}
          class Parse(HTMLParser):
              def __init__(self):
                  super().__init__();self.in_title=False;self.in_h1=False;self.title="";self.h1=[];self.meta={};self.links={};self.h1_text=""
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="title":self.in_title=True
                  if tag=="h1":self.in_h1=True;self.h1_text=""
                  if tag=="meta":
                      key=a.get("name") or a.get("property")
                      if key:self.meta[key]=a.get("content","")
                  if tag=="link" and a.get("rel")=="canonical":self.links["canonical"]=a.get("href","")
              def handle_data(self,data):
                  if self.in_title:self.title+=data
                  if self.in_h1:self.h1_text+=data
              def handle_endtag(self,tag):
                  if tag=="title":self.in_title=False
                  if tag=="h1":self.in_h1=False;self.h1.append(" ".join(self.h1_text.split()))
          def request(path):
              r=urllib.request.Request(path,headers={"User-Agent":"Mozilla/5.0 VikeyLiveAudit/1.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(r,timeout=35) as response:return response.status,response.url,response.read().decode("utf-8","replace")
          try:
              status,final,html=request(url)
              record("HTTP 200",status,200)
              p=Parse();p.feed(html)
              record("Title",p.title,expected["title"])
              record("Description",p.meta.get("description",""),expected["description"])
              record("robots",p.meta.get("robots",""),"index,follow")
              record("canonical",p.links.get("canonical",""),expected["canonical"])
              record("og:url",p.meta.get("og:url",""),url)
              record("H1 count",len(p.h1),1)
              record("H1 text",p.h1[0] if p.h1 else "",expected["h1"])
          except Exception as exc:report["errors"].append("New page: "+str(exc))
          try:
              status,final,xml=request(base+"/sitemap.xml")
              urls=re.findall(r"<loc>\s*([^<]+)\s*</loc>",xml)
              urls=[x.strip() for x in urls]
              record("sitemap HTTP",status,200)
              record("sitemap URL count",len(urls),14)
              record("sitemap contains new case",url in urls,True)
          except Exception as exc:report["errors"].append("Sitemap: "+str(exc))
          report["passed"]=bool(report["checks"]) and len(report["checks"])==11 and all(x["passed"] for x in report["checks"].values()) and not report["errors"]
          with open(".github/vikey-brand-live-only-report-temp.json","w") as f:json.dump(report,f,ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if not report["passed"]:raise SystemExit(1)
          PY
      - name: Preserve temporary report
        if: always()
        run: |
          if [ ! -f .github/vikey-brand-live-only-report-temp.json ]; then
            echo '{"passed":false,"errors":["Audit did not create report"]}' > .github/vikey-brand-live-only-report-temp.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/vikey-brand-live-only-report-temp.json
          if ! git diff --cached --quiet; then
            git commit -m "Temporary strict personal brand live audit report"
            git push origin HEAD:main
          fi
      - name: Strict result
        if: always()
        run: |
          test "${{ steps.audit.outcome }}" = "success"
          python3 -c "import json,sys;sys.exit(0 if json.load(open('.github/vikey-brand-live-only-report-temp.json')).get('passed') else 1)"
