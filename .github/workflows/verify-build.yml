name: Verify independent production build

on:
  push:
    paths:
      - ".github/workflows/verify-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install and build with log capture
        shell: bash
        run: |
          set +e
          {
            echo "=== bun install --frozen-lockfile ==="
            bun install --frozen-lockfile
            install_code=$?
            echo
            echo "Install exit code: $install_code"

            if [ "$install_code" -eq 0 ]; then
              echo
              echo "=== bun run build ==="
              bun run build
              build_code=$?
            else
              build_code=99
            fi

            echo
            echo "Build exit code: $build_code"
          } > BUILD_LOG.txt 2>&1

          if [ "$install_code" -eq 0 ] && [ "$build_code" -eq 0 ]; then
            printf "Independent production build: OK\nFinal Lovable cleanup verified: YES\nCommit: %s\n" "$GITHUB_SHA" > BUILD_CHECK.txt
          else
            printf "Independent production build: FAILED\nInstall exit code: %s\nBuild exit code: %s\nCommit: %s\n" "$install_code" "$build_code" "$GITHUB_SHA" > BUILD_CHECK.txt
          fi

          cat BUILD_CHECK.txt
          tail -n 160 BUILD_LOG.txt || true

      - name: Commit build result
        if: always()
        run: |
          git config user.name "ChatGPT migration"
          git config user.email "actions@users.noreply.github.com"
          git add BUILD_CHECK.txt BUILD_LOG.txt
          git commit -m "Verify clean independent production build" || true
          git push || true

# final cleanup verification
