name: Build project packaging SEO branch

on:
  push:
    branches:
      - seo-upakovka-proekta
    paths:
      - '.github/workflows/build-project-packaging-seo.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Production build and checks
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          page='.output/public/upakovka-proekta/index.html'
          test -f "$page"
          grep -aFq 'Упаковка проекта под ключ для бизнеса | Vikey AI' "$page"
          grep -aFq 'Помогаю упаковать проект или услугу: позиционирование, структура, оффер, презентационные материалы и понятная подача для клиентов и партнёров.' "$page"
          grep -aFq 'name="robots" content="index,follow"' "$page"
          grep -aFq 'rel="canonical" href="https://chelovek-neiroset.ru/upakovka-proekta/"' "$page"
          grep -aFq 'property="og:url" content="https://chelovek-neiroset.ru/upakovka-proekta/"' "$page"
          test "$(grep -ao '<h1' "$page" | wc -l)" -eq 1
          grep -aFq 'Упаковка проекта под ключ' "$page"
          grep -aFq 'B2B-упаковка услуги психологической поддержки для HoReCa' "$page"
          grep -aFq 'психолога со стажем более 20 лет' "$page"
          grep -aFq 'база потенциальных компаний и контактов для первичного выхода' "$page"
          grep -aFq 'href="/sayty-dlya-biznesa/"' "$page"
          grep -aFq 'href="/#calc"' "$page"
          grep -aFq 'https://t.me/Vikey_shel' "$page"
          grep -aFq 'https://wa.me/79081747077' "$page"
          grep -aFq 'https://max.ru/u/f9LHodD0cOKqFcs6UZJNI7fMntxJ8xCv4X4bwued0XRebPD3LFvJ6CgS3cA' "$page"
          test "$(grep -ao '<details' "$page" | wc -l)" -eq 6
          test -f src/assets/b2b-horeca-card.webp
          echo "HORECA_ASSET_BYTES=$(stat -c%s src/assets/b2b-horeca-card.webp)"
          test "$(grep -c '<loc>' public/sitemap.xml)" -eq 8
          grep -Fq '<loc>https://chelovek-neiroset.ru/upakovka-proekta/</loc>' public/sitemap.xml
          grep -Fq 'Sitemap: https://chelovek-neiroset.ru/sitemap.xml' public/robots.txt
          ! grep -RniE 'navigator\.serviceWorker|serviceWorker\.register|vite-plugin-pwa|workbox' src package.json vite.config.ts

      - name: Commit generated route tree and remove workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git rm .github/workflows/build-project-packaging-seo.yml
          git commit -m "Generate project packaging route tree and finish verification"
          git push
