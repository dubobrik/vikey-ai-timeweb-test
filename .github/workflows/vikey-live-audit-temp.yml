name: Temporary live SEO audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vikey-live-audit-temp.yml'
permissions:
  contents: write
jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser test tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Run browser audit
        id: audit
        continue-on-error: true
        run: |
          cat > /tmp/vikey-live-audit.cjs <<'AUDIT'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          const base='https://chelovek-neiroset.ru';
          const target='/case-ai-telegram-bot/';
          const canonical=base+target;
          const expected={
           title:'Разработка AI Telegram-бота с базой знаний — кейс Vikey AI',
           description:'Кейс Vikey AI: разработка Telegram-бота с базой знаний, AI, пользовательскими сценариями, изображениями, оплатой и серверным размещением под ключ.',
           h1:'Разработка AI Telegram-бота с базой знаний'
          };
          const routes=['/','/privacy','/sayty-dlya-biznesa/','/ii-assistent-dlya-biznesa/','/telegram-boty-dlya-biznesa/','/avtomatizaciya-biznesa-ai/','/ai-video-dlya-biznesa/','/upakovka-proekta/','/case-sayt-gostevye-domiki/','/case-b2b-horeca/',target];
          const report={timestamp:new Date().toISOString(),target,checks:{},devices:{},regressions:[],errors:[]};
          const check=(name,actual,expectedValue)=>{report.checks[name]={pass:actual===expectedValue,actual,expected:expectedValue};};
          const safe=async(label,fn)=>{try{return await fn()}catch(e){report.errors.push(label+': '+String(e.message||e));return null}};
          (async()=>{
           const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
           const ctx=await browser.newContext({viewport:{width:1440,height:900},ignoreHTTPSErrors:false});
           const req=ctx.request;
           await safe('http',async()=>{const r=await req.get(canonical,{maxRedirects:0,timeout:30000});check('http200',r.status(),200)});
           await safe('slashRedirect',async()=>{const r=await req.get(base+'/case-ai-telegram-bot',{maxRedirects:0,timeout:30000});const loc=r.headers()['location']||'';report.checks.slashRedirect={pass:[301,302,307,308].includes(r.status())&&(loc===target||loc===canonical),status:r.status(),location:loc}});
           await safe('sitemap',async()=>{const r=await req.get(base+'/sitemap.xml',{timeout:30000});const xml=await r.text();const urls=[...xml.matchAll(/<loc>\s*([^<]+)\s*<\/loc>/g)].map(m=>m[1].trim());report.checks.sitemap={pass:r.status()===200&&urls.length===11&&urls.includes(canonical),status:r.status(),count:urls.length,hasCase:urls.includes(canonical)}});
           for(const [path,name] of [['/','homeLink'],['/telegram-boty-dlya-biznesa/','serviceToCase'],[target,'caseToService'],[target,'caseToAI']]){
            await safe(name,async()=>{const page=await ctx.newPage();try{const r=await page.goto(base+path,{waitUntil:'domcontentloaded',timeout:45000});const href=name==='caseToService'?'/telegram-boty-dlya-biznesa/':name==='caseToAI'?'/ii-assistent-dlya-biznesa/':target;report.checks[name]={pass:r.status()===200&&(await page.locator('a[href="'+href+'"]').count())>0,status:r.status(),href,count:await page.locator('a[href="'+href+'"]').count()}}finally{await page.close()}})}
           const page=await ctx.newPage();
           await safe('meta',async()=>{await page.goto(canonical,{waitUntil:'domcontentloaded',timeout:45000});const data=await page.evaluate(()=>({title:document.title,description:document.querySelector('meta[name="description"]')?.content||'',robots:document.querySelector('meta[name="robots"]')?.content||'',canonical:document.querySelector('link[rel="canonical"]')?.href||'',ogUrl:document.querySelector('meta[property="og:url"]')?.content||'',h1s:[...document.querySelectorAll('h1')].map(x=>x.textContent.trim().replace(/\s+/g,' ')),manifest:!!document.querySelector('link[rel="manifest"]')}));check('title',data.title,expected.title);check('description',data.description,expected.description);check('robots',data.robots,'index,follow');check('canonical',data.canonical,canonical);check('ogUrl',data.ogUrl,canonical);check('h1Count',data.h1s.length,1);check('h1',data.h1s[0],expected.h1);check('pwaManifestAbsent',data.manifest,false)});
           await safe('regressions',async()=>{for(const route of routes){try{const r=await req.get(base+route,{timeout:30000});report.regressions.push({route,status:r.status(),pass:r.status()===200})}catch(e){report.regressions.push({route,pass:false,error:String(e.message||e)})}}});
           await page.close();
           for(const [name,w,h] of [['iPhone',390,844],['Android',412,915],['Desktop',1440,900]]){
            await safe('device '+name,async()=>{
             const deviceCtx=await browser.newContext({viewport:{width:w,height:h},deviceScaleFactor:name==='Desktop'?1:3,isMobile:name!=='Desktop',hasTouch:name!=='Desktop'});
             const p=await deviceCtx.newPage();
             await p.addInitScript(()=>{window.__cls=0;try{new PerformanceObserver(list=>{for(const e of list.getEntries())if(!e.hadRecentInput)window.__cls+=e.value}).observe({type:'layout-shift',buffered:true})}catch(e){}});
             const response=await p.goto(canonical,{waitUntil:'domcontentloaded',timeout:45000});
             await p.waitForTimeout(2200);
             const data=await p.evaluate(async()=>({overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+1,scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,cls:window.__cls||0,h1Visible:(()=>{const e=document.querySelector('h1');if(!e)return false;const r=e.getBoundingClientRect();return r.width>0&&r.left>=-1&&r.right<=window.innerWidth+1})(),faqCount:document.querySelectorAll('details').length,ctaCount:document.querySelectorAll('a[href="/#calc"],a[href="/#contact"]').length,header:!!document.querySelector('header'),footer:!!document.querySelector('footer'),swRegistrations:'serviceWorker' in navigator?(await navigator.serviceWorker.getRegistrations()).length:0}));
             const details=p.locator('details').first();let faqWorks=false;if(await details.count()){await details.locator('summary').click();faqWorks=await details.evaluate(el=>el.open)}
             const refreshed=await p.reload({waitUntil:'domcontentloaded',timeout:45000});
             report.devices[name]={width:w,height:h,status:response.status(),refreshStatus:refreshed.status(),...data,faqWorks,pass:response.status()===200&&refreshed.status()===200&&!data.overflow&&data.cls<=0.1&&data.h1Visible&&data.faqCount>=6&&faqWorks&&data.ctaCount>0&&data.header&&data.footer&&data.swRegistrations===0};
             await deviceCtx.close();
            });
           }
           await browser.close();
          })().catch(e=>{report.errors.push('fatal: '+String(e.stack||e))}).finally(()=>{
           const passes=Object.values(report.checks).every(x=>x.pass)&&report.regressions.every(x=>x.pass)&&Object.values(report.devices).length===3&&Object.values(report.devices).every(x=>x.pass)&&report.errors.length===0;
           report.pass=passes;fs.writeFileSync('.github/live-audit-result.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify({pass:report.pass,checks:report.checks,devices:report.devices,regressions:report.regressions,errors:report.errors},null,2));process.exitCode=passes?0:1;
          });
          AUDIT
          cp /tmp/vikey-live-audit.cjs ./vikey-live-audit-temp.cjs
          node ./vikey-live-audit-temp.cjs
      - name: Save report in GitHub for inspection
        if: always()
        run: |
          if [ ! -f .github/live-audit-result.json ]; then
            printf '{"pass":false,"errors":["Audit failed before report creation"]}\n' > .github/live-audit-result.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/live-audit-result.json
          git commit -m "Temporary live audit results"
          git push origin HEAD:main
      - name: Enforce audit result
        if: always()
        run: |
          node -e "const r=require('./.github/live-audit-result.json');if(!r.pass)process.exit(1)"
