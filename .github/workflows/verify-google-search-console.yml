name: Verify Google Search Console file

on:
  push:
    paths:
      - .github/workflows/verify-google-search-console.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify production build
        run: |
          bun run build
          test -f .output/public/googlec42b7c8e9feb6a42.html
          test "$(cat .output/public/googlec42b7c8e9feb6a42.html)" = "google-site-verification: googlec42b7c8e9feb6a42.html"

      - name: Wait for Timeweb deploy and verify live URL
        run: |
          for i in $(seq 1 30); do
            body="$(curl -fsS https://chelovek-neiroset.ru/googlec42b7c8e9feb6a42.html 2>/dev/null || true)"
            if [ "$body" = "google-site-verification: googlec42b7c8e9feb6a42.html" ]; then
              echo "Live verification file is available"
              exit 0
            fi
            echo "Waiting for deploy... attempt $i/30"
            sleep 10
          done
          echo "Verification file did not become available in time"
          exit 1

      - name: Remove temporary workflow
        run: |
          rm .github/workflows/verify-google-search-console.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-google-search-console.yml
          git commit -m "Remove temporary Google verification workflow"
          git push
