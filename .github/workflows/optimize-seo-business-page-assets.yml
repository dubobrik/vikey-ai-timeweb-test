name: Verify optimized SEO business page

on:
  push:
    paths:
      - '.github/workflows/optimize-seo-business-page-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify requested source changes only
        run: |
          set -euo pipefail
          grep -Fq 'savana-site-preview.webp' src/routes/sayty-dlya-biznesa.tsx
          grep -Fq 'stone-master-preview.webp' src/routes/sayty-dlya-biznesa.tsx
          grep -Fq 'tarhankut-preview.webp' src/routes/sayty-dlya-biznesa.tsx
          grep -Fq 'https://t.me/Vikey_shel' src/routes/sayty-dlya-biznesa.tsx
          ! grep -Fq 'https://t.me/vikey_shell' src/routes/sayty-dlya-biznesa.tsx
          test -f src/assets/savana-site-preview.webp
          test -f src/assets/stone-master-preview.webp
          test -f src/assets/tarhankut-preview.webp

      - name: Verify live deploy
        run: |
          set -euo pipefail
          url='https://chelovek-neiroset.ru/sayty-dlya-biznesa/'
          curl -fsSL -H 'Accept-Encoding: identity' "$url" -o /tmp/page.html
          grep -aFq 'https://t.me/Vikey_shel' /tmp/page.html
          ! grep -aFq 'https://t.me/vikey_shell' /tmp/page.html
          grep -aEq 'savana-site-preview[^" ]*\.webp' /tmp/page.html
          grep -aEq 'stone-master-preview[^" ]*\.webp' /tmp/page.html
          grep -aEq 'tarhankut-preview[^" ]*\.webp' /tmp/page.html

      - name: Browser checks desktop and mobile
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const target = 'https://chelovek-neiroset.ru/sayty-dlya-biznesa/';
          const profiles = [
            ['iPhone', { width: 390, height: 844 }, true, 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'],
            ['Android', { width: 412, height: 915 }, true, 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36 Chrome/140.0.0.0 Mobile Safari/537.36'],
            ['Desktop', { width: 1440, height: 900 }, false, 'Mozilla/5.0 Chrome/140.0.0.0 Safari/537.36'],
          ];
          for (const [name, viewport, isMobile, userAgent] of profiles) {
            const context = await browser.newContext({ viewport, isMobile, hasTouch: isMobile, userAgent });
            const page = await context.newPage();
            const response = await page.goto(target, { waitUntil: 'networkidle' });
            if (!response || response.status() !== 200) throw new Error(`${name}: HTTP 200 failed`);
            if (await page.locator('a[href="https://t.me/Vikey_shel"]').count() !== 1) throw new Error(`${name}: Telegram link failed`);
            if (await page.locator('a[href="https://t.me/vikey_shell"]').count() !== 0) throw new Error(`${name}: old Telegram link remains`);

            const imgs = page.locator('#cases img');
            if (await imgs.count() !== 4) throw new Error(`${name}: expected 4 case images`);
            for (let i = 0; i < 4; i++) {
              const img = imgs.nth(i);
              const attrs = await img.evaluate((el) => ({
                path: new URL(el.currentSrc || el.src, location.href).pathname,
                loading: el.getAttribute('loading'),
                width: el.getAttribute('width'),
                height: el.getAttribute('height'),
                alt: el.getAttribute('alt'),
              }));
              if (!attrs.path.endsWith('.webp') || attrs.loading !== 'lazy' || !attrs.width || !attrs.height || !attrs.alt) {
                throw new Error(`${name}: image ${i + 1} attributes/WebP failed`);
              }
              await img.scrollIntoViewIfNeeded();
              await page.waitForFunction((index) => {
                const el = document.querySelectorAll('#cases img')[index];
                return el instanceof HTMLImageElement && el.complete && el.naturalWidth > 0;
              }, i, { timeout: 10000 });
            }

            const dims = await page.evaluate(() => ({ sw: document.documentElement.scrollWidth, cw: document.documentElement.clientWidth }));
            if (dims.sw > dims.cw + 1) throw new Error(`${name}: horizontal overflow ${dims.sw}/${dims.cw}`);
            console.log(`${name}: OK`);
            await context.close();
          }
          await browser.close();
          NODE

      - name: Remove temporary workflow
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/optimize-seo-business-page-assets.yml
          git commit -m "Remove temporary SEO page verification workflow"
          git push
