name: Update help cards and calculator

on:
  push:
    paths:
      - ".github/workflows/update-help-calculator.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply site changes
        run: python3 scripts/update_help_calc.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify production build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Commit changes
        run: |
          git config user.name "ChatGPT site updates"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/index.tsx
          git commit -m "Make help cards clickable and add Other option"
          git push
