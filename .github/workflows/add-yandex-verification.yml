name: Add Yandex verification file

on:
  push:
    paths:
      - .github/workflows/add-yandex-verification.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Yandex verification file
        run: |
          cat > public/yandex_6e9318c679eee646.html <<'EOF'
          <html>
              <head>
                  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
              </head>
              <body>Verification: 6e9318c679eee646</body>
          </html>
          EOF

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify production build
        run: |
          bun run build
          test -f .output/public/yandex_6e9318c679eee646.html
          grep -F "Verification: 6e9318c679eee646" .output/public/yandex_6e9318c679eee646.html

      - name: Commit only verification file
        run: |
          rm .github/workflows/add-yandex-verification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/yandex_6e9318c679eee646.html .github/workflows/add-yandex-verification.yml
          git commit -m "Add Yandex Webmaster verification file"
          git push
