name: Verify production build

on:
  push:
    paths:
      - ".github/workflows/verify-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: Record successful build
        run: |
          printf "Production build: OK\nCommit: %s\n" "$GITHUB_SHA" > BUILD_CHECK.txt
          git config user.name "ChatGPT migration"
          git config user.email "actions@users.noreply.github.com"
          git add BUILD_CHECK.txt
          git commit -m "Record successful production build"
          git push
