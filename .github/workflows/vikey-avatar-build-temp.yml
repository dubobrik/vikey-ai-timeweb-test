name: Temporary digital avatar production build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vikey-avatar-build-temp.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Production build and route verification
        run: |
          bun run build
          test -f src/routeTree.gen.ts
          grep -Fq '/case-cifrovoy-avatar' src/routeTree.gen.ts
          echo "AVATAR_ROUTE_GENERATED=YES"
          test "$(grep -c '<loc>' public/sitemap.xml)" -eq 12
      - name: Commit only generated route tree
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routeTree.gen.ts
            git commit -m "Generate TanStack route tree for avatar case"
            git push origin HEAD:main
          fi
