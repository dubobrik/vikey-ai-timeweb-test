name: Make services block static

on:
  push:
    paths:
      - ".github/workflows/update-services-static.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update services block styling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/routes/index.tsx")
          text = path.read_text(encoding="utf-8")

          old_card = 'className="group relative overflow-hidden rounded-2xl border border-border bg-card p-6 shadow-card transition hover:-translate-y-1 hover:border-neon/50"'
          new_card = 'className="relative overflow-hidden rounded-2xl border border-border bg-card p-6 shadow-card"'
          if old_card not in text:
              raise SystemExit("Services card class not found")
          text = text.replace(old_card, new_card, 1)

          old_icon = 'className="mb-4 grid h-11 w-11 place-items-center rounded-xl bg-gradient-primary text-lg text-primary-foreground shadow-glow"'
          new_icon = 'className="mb-4 grid h-11 w-11 place-items-center rounded-xl border border-[#8B7BC8]/30 bg-[#8B7BC8]/10 text-lg text-[#8B7BC8]"'
          if old_icon not in text:
              raise SystemExit("Services icon class not found")
          text = text.replace(old_icon, new_icon, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify production build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Commit changes and remove workflow
        run: |
          git config user.name "ChatGPT site updates"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/index.tsx
          git rm .github/workflows/update-services-static.yml
          git commit -m "Make services cards static and soften icons"
          git push
