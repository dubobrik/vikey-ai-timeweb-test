name: Build Tarhankut SEO case

on:
  push:
    branches:
      - seo-case-sayt-gostevye-domiki
    paths:
      - '.github/workflows/build-tarhankut-case.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Production build and source checks
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          page='.output/public/case-sayt-gostevye-domiki/index.html'
          test -f "$page"
          grep -aFq 'Создание сайта для гостевого дома — кейс Vikey AI' "$page"
          grep -aFq 'Кейс Vikey AI: создание сайта для гостевых домиков в Оленевке на Тарханкуте. Структура, мобильная версия, визуальная подача и понятный путь к контакту.' "$page"
          grep -aFq 'name="robots" content="index,follow"' "$page"
          grep -aFq 'rel="canonical" href="https://chelovek-neiroset.ru/case-sayt-gostevye-domiki/"' "$page"
          grep -aFq 'property="og:url" content="https://chelovek-neiroset.ru/case-sayt-gostevye-domiki/"' "$page"
          test "$(grep -ao '<h1' "$page" | wc -l)" -eq 1
          grep -aFq 'Создание сайта для гостевых домиков в Оленевке' "$page"
          grep -aFq 'https://tarhankut.space/' "$page"
          grep -aFq 'href="/sayty-dlya-biznesa/"' "$page"
          grep -aFq 'href="/#calc"' "$page"
          grep -aFq 'https://t.me/Vikey_shel' "$page"
          grep -aFq 'https://wa.me/79081747077' "$page"
          grep -aFq 'https://max.ru/u/f9LHodD0cOKqFcs6UZJNI7fMntxJ8xCv4X4bwued0XRebPD3LFvJ6CgS3cA' "$page"
          test "$(grep -ao '<details' "$page" | wc -l)" -eq 6
          grep -aFq 'Сайт гостевых домиков в Оленевке на Тарханкуте — кейс Vikey AI' "$page"
          grep -aFq 'width="1280"' "$page"
          grep -aFq 'height="800"' "$page"
          grep -aFq 'loading="lazy"' "$page"
          grep -aFq 'decoding="async"' "$page"
          test -f src/assets/tarhankut-preview.webp
          echo "TARHANKUT_ASSET_BYTES=$(stat -c%s src/assets/tarhankut-preview.webp)"
          test "$(grep -c '<loc>' public/sitemap.xml)" -eq 9
          grep -Fq '<loc>https://chelovek-neiroset.ru/case-sayt-gostevye-domiki/</loc>' public/sitemap.xml
          grep -Fq 'caseHref: "/case-sayt-gostevye-domiki/"' src/routes/index.tsx
          grep -Fq 'caseHref: "/case-sayt-gostevye-domiki/"' src/routes/sayty-dlya-biznesa.tsx
          ! grep -RniE 'navigator\.serviceWorker|serviceWorker\.register|vite-plugin-pwa|workbox' src package.json vite.config.ts

      - name: Commit generated route tree and remove workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git rm .github/workflows/build-tarhankut-case.yml
          git commit -m "Generate Tarhankut case route tree and finish verification"
          git push
