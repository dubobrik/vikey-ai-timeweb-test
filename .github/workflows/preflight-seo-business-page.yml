name: Preflight SEO business page

on:
  push:
    paths:
      - .github/workflows/preflight-seo-business-page.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify live deploy matches repository service files
        run: |
          set -euo pipefail
          curl -fsSL https://chelovek-neiroset.ru/sitemap.xml -o /tmp/live-sitemap.xml
          cmp public/sitemap.xml /tmp/live-sitemap.xml
          curl -fsSL https://chelovek-neiroset.ru/robots.txt -o /tmp/live-robots.txt
          cmp public/robots.txt /tmp/live-robots.txt
          echo "LIVE_DEPLOY_MATCH=YES"

      - name: Check trailing slash behavior
        run: |
          set -euo pipefail
          echo "PRIVACY_NO_SLASH"
          curl -sS -o /dev/null -D - https://chelovek-neiroset.ru/privacy | sed -n '1p;/^[Ll]ocation:/p'
          echo "PRIVACY_WITH_SLASH"
          curl -sS -o /dev/null -D - https://chelovek-neiroset.ru/privacy/ | sed -n '1p;/^[Ll]ocation:/p'
          echo "FINAL_NO_SLASH=$(curl -sS -L -o /dev/null -w '%{http_code} %{url_effective}' https://chelovek-neiroset.ru/privacy)"
          echo "FINAL_WITH_SLASH=$(curl -sS -L -o /dev/null -w '%{http_code} %{url_effective}' https://chelovek-neiroset.ru/privacy/)"

      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/preflight-seo-business-page.yml
          git commit -m "Remove SEO business page preflight workflow"
          git push
