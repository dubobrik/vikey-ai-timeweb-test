name: Temporary install interactive Vikey V logo
on:
  push:
    branches: [main]
    paths: ['Vikey_3D_V_logo_install.zip']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Validate and unpack 3D installation kit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          zpath=Path('Vikey_3D_V_logo_install.zip')
          assert zpath.exists(), 'Upload archive to repository root'
          required={
            'src/components/InteractiveVLogo.tsx',
            'public/models/vikey-v-logo.glb',
            'install_v_logo.py'
          }
          with zipfile.ZipFile(zpath) as z:
              assert set(z.namelist()) == required, 'Unexpected archive entries'
              assert z.testzip() is None, 'Corrupt archive'
              assert all('..' not in Path(n).parts and not n.startswith('/') for n in z.namelist()), 'Unsafe archive'
              z.extractall('.')
          with open('public/models/vikey-v-logo.glb','rb') as f:
              assert f.read(4)==b'glTF', 'Invalid GLB'
          PY
      - name: Insert lightweight lazy viewer beside hero CTA
        run: python3 install_v_logo.py
      - name: Install bundled WebGL library
        run: |
          bun add three
          bun add -d @types/three
      - name: Production build and checks
        run: |
          bun run build
          test -s public/models/vikey-v-logo.glb
          grep -Fq 'InteractiveVLogo' src/routes/index.tsx
          ! grep -q -E 'vite-plugin-pwa|workbox' package.json
          test "$(grep -c '<loc>' public/sitemap.xml)" -eq 16
      - name: Commit production files and remove temporary install kit
        run: |
          rm install_v_logo.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f Vikey_3D_V_logo_install.zip
          git rm -f .github/workflows/vikey-install-3d-logo-temp.yml
          git add src/components/InteractiveVLogo.tsx public/models/vikey-v-logo.glb src/routes/index.tsx package.json bun.lock
          git commit -m "Add on-demand interactive 3D V logo beside hero contact CTA"
          git push origin HEAD:main
