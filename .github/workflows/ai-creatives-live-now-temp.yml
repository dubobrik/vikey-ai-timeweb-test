name: Temporary AI creatives current live check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ai-creatives-live-now-temp.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check current published version
        id: audit
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json,urllib.request,re
          from html.parser import HTMLParser
          base='https://chelovek-neiroset.ru'
          path='/ai-kreativy-dlya-biznesa/'
          url=base+path
          out={'checks':{},'errors':[]}
          def ck(name,actual,expected):out['checks'][name]={'pass':actual==expected,'actual':actual}
          class H(HTMLParser):
           def __init__(self):super().__init__();self.title='';self.ht=False;self.h1=[];self.h=False;self.cur='';self.meta={};self.canonical=''
           def handle_starttag(self,t,a):
            x=dict(a)
            if t=='title':self.ht=True
            if t=='h1':self.h=True;self.cur=''
            if t=='meta':self.meta[x.get('name') or x.get('property')]=x.get('content')
            if t=='link' and x.get('rel')=='canonical':self.canonical=x.get('href','')
           def handle_data(self,s):
            if self.ht:self.title+=s
            if self.h:self.cur+=s
           def handle_endtag(self,t):
            if t=='title':self.ht=False
            if t=='h1':self.h=False;self.h1.append(' '.join(self.cur.split()))
          def get(u):
           q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
           with urllib.request.urlopen(q,timeout=30) as r:return r.status,r.read().decode('utf-8','replace')
          try:
           code,html=get(url);p=H();p.feed(html)
           ck('HTTP',code,200)
           ck('Title',p.title,'AI-креативы для бизнеса и рекламы | Vikey AI')
           ck('Description',p.meta.get('description'),'Создаю AI-креативы и визуальный контент для бизнеса: изображения для рекламы, сайтов, соцсетей, презентаций и проектов под конкретную задачу.')
           ck('robots',p.meta.get('robots'),'index,follow')
           ck('canonical',p.canonical,url)
           ck('og:url',p.meta.get('og:url'),url)
           ck('H1 count',len(p.h1),1)
           ck('H1 text',p.h1[0] if p.h1 else None,'Создание AI-креативов для бизнеса')
          except Exception as e:out['errors'].append('page: '+str(e))
          try:
           code,xml=get(base+'/sitemap.xml');locs=re.findall('<loc>\\s*([^<]+)\\s*</loc>',xml)
           ck('sitemap HTTP',code,200)
           ck('sitemap 15',len(locs),15)
           ck('sitemap new URL',url in [x.strip() for x in locs],True)
          except Exception as e:out['errors'].append('sitemap: '+str(e))
          try:
           code,home=get(base+'/');ck('home HTTP',code,200);ck('home link',path in home,True)
          except Exception as e:out['errors'].append('home: '+str(e))
          out['passed']=len(out['checks'])==13 and all(x['pass'] for x in out['checks'].values()) and not out['errors']
          print(json.dumps(out,ensure_ascii=False,indent=2))
          with open('.github/ai-creatives-live-now-temp.json','w') as f:json.dump(out,f,ensure_ascii=False,indent=2)
          if not out['passed']:raise SystemExit(1)
          PY
      - name: Store temporary result
        if: always()
        run: |
          if [ ! -f .github/ai-creatives-live-now-temp.json ]; then
            echo '{"passed":false,"errors":["No report generated"]}' > .github/ai-creatives-live-now-temp.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ai-creatives-live-now-temp.json
          git commit -m "Temporary: latest AI creatives live status"
          git push origin HEAD:main
      - name: Fail if site not updated
        if: always()
        run: |
          test "${{ steps.audit.outcome }}" = "success"
          python3 -c "import json,sys;sys.exit(0 if json.load(open('.github/ai-creatives-live-now-temp.json')).get('passed') else 1)"
