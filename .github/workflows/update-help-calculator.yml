name: Update help cards and calculator

on:
  push:
    paths:
      - ".github/workflows/update-help-calculator.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update help cards and calculator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/routes/index.tsx")
          text = path.read_text(encoding="utf-8")

          # 1) Add “Другое” to the practical-directions block.
          marker = '  "Внедрить AI-помощника или чат-бота",\n];'
          replacement = '  "Внедрить AI-помощника или чат-бота",\n  "Другое",\n];'
          if marker not in text and '  "Другое",\n];' not in text:
              raise SystemExit("Help list marker not found")
          if marker in text:
              text = text.replace(marker, replacement, 1)

          # 2) Make every practical-direction card an accessible link to the calculator.
          old_card = '''          <div key={h} className="group rounded-xl border border-border bg-card/50 p-5 transition hover:border-neon/50">
            <div className="mb-3 grid h-9 w-9 place-items-center rounded-lg bg-gradient-primary text-sm font-bold text-primary-foreground">
              {i + 1}
            </div>
            <p className="text-sm text-foreground">{h}</p>
          </div>'''
          new_card = '''          <a
            key={h}
            href="#calc"
            aria-label={`${h} — перейти к калькулятору`}
            className="group rounded-xl border border-border bg-card/50 p-5 transition hover:-translate-y-0.5 hover:border-neon/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-neon/60"
          >
            <div className="mb-3 grid h-9 w-9 place-items-center rounded-lg bg-gradient-primary text-sm font-bold text-primary-foreground">
              {i + 1}
            </div>
            <p className="text-sm text-foreground">{h}</p>
          </a>'''
          if old_card in text:
              text = text.replace(old_card, new_card, 1)
          elif 'aria-label={`${h} — перейти к калькулятору`}' not in text:
              raise SystemExit("Help card block not found")

          # 3) Add “Другое” to the calculator with preliminary price from 1,000 ₽.
          calc_marker = '  { key: "avatar", label: "Цифровой аватар / AI-видео", price: 5000 },\n];'
          calc_replacement = '  { key: "avatar", label: "Цифровой аватар / AI-видео", price: 5000 },\n  { key: "other", label: "Другое", price: 1000 },\n];'
          if calc_marker in text:
              text = text.replace(calc_marker, calc_replacement, 1)
          elif '{ key: "other", label: "Другое", price: 1000 }' not in text:
              raise SystemExit("Calculator marker not found")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify production build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Commit changes
        run: |
          git config user.name "ChatGPT site updates"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/index.tsx
          git commit -m "Make help cards clickable and add Other option"
          git push
