name: Temporary AI creatives production build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vikey-creatives-build-temp.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Build and validate route and sitemap
        run: |
          bun run build
          grep -Fq '/ai-kreativy-dlya-biznesa' src/routeTree.gen.ts
          test "$(grep -c '<loc>' public/sitemap.xml)" -eq 15
          ! grep -q -E 'vite-plugin-pwa|workbox' package.json
      - name: Commit only generated route tree
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routeTree.gen.ts
            git commit -m "Generate TanStack route tree for AI creatives"
            git push origin HEAD:main
          fi
