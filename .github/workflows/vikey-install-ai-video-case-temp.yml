name: Temporary install real AI photo-to-video case
on:
  push:
    branches: [main]
    paths:
      - 'AI_VIDEO_IZ_FOTO_UPLOAD_TO_GITHUB.zip'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Validate and unpack user media bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archive=Path('AI_VIDEO_IZ_FOTO_UPLOAD_TO_GITHUB.zip')
          assert archive.exists(), 'Bundle not uploaded to repository root'
          required={
            'src/assets/ai-video-source-01.webp',
            'src/assets/ai-video-source-02.webp',
            'src/assets/ai-video-result-01-poster.webp',
            'src/assets/ai-video-result-02-poster.webp',
            'public/assets/ai-video-result-01.mp4',
            'public/assets/ai-video-result-02.mp4',
            'src/routes/case-ai-video-iz-foto.tsx',
            'apply_case_links.py'
          }
          with zipfile.ZipFile(archive) as z:
              assert set(z.namelist())==required,'Unexpected or missing archive entries'
              assert z.testzip() is None,'Corrupt bundle'
              for member in z.namelist():
                  assert '..' not in Path(member).parts and not member.startswith('/'),'Unsafe zip entry'
              z.extractall('.')
          PY
      - name: Apply SEO linking and sitemap patch
        run: python3 apply_case_links.py
      - name: Production build
        run: |
          bun install --frozen-lockfile
          bun run build
          grep -Fq '/case-ai-video-iz-foto' src/routeTree.gen.ts
          test "$(grep -c '<loc>' public/sitemap.xml)" -eq 16
          ! grep -q -E 'vite-plugin-pwa|workbox' package.json
          test -s public/assets/ai-video-result-01.mp4
          test -s public/assets/ai-video-result-02.mp4
      - name: Commit final files and remove temporary files
        run: |
          rm apply_case_links.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f AI_VIDEO_IZ_FOTO_UPLOAD_TO_GITHUB.zip
          git rm -f .github/workflows/vikey-install-ai-video-case-temp.yml
          git add src/routes/case-ai-video-iz-foto.tsx src/routes/index.tsx src/routes/ai-video-dlya-biznesa.tsx src/routes/ai-kreativy-dlya-biznesa.tsx src/routeTree.gen.ts src/assets/ai-video-*.webp public/assets/ai-video-result-*.mp4 public/sitemap.xml
          git commit -m "Publish AI photo-to-video case with paired media, sitemap and links"
          git push origin HEAD:main
