name: Temporary 3D logo clarity responsive live audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vikey-logo-clarity-live-temp.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        id: install
        continue-on-error: true
        run: |
          npm install --prefix /tmp/vikey-logo-clarity-browser --no-save playwright
          /tmp/vikey-logo-clarity-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Syntax
        id: syntax
        continue-on-error: true
        run: node --check .github/vikey-logo-clarity-live-temp.cjs
      - name: Run live tests
        id: audit
        if: steps.install.outcome == 'success' && steps.syntax.outcome == 'success'
        continue-on-error: true
        env:
          NODE_PATH: /tmp/vikey-logo-clarity-browser/node_modules
        run: node .github/vikey-logo-clarity-live-temp.cjs
      - name: Save report
        if: always()
        run: |
          if [ ! -f .github/vikey-logo-clarity-live-result-temp.json ]; then echo '{"passed":false,"errors":["Report missing"]}' > .github/vikey-logo-clarity-live-result-temp.json; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/vikey-logo-clarity-live-result-temp.json
          if ! git diff --cached --quiet; then
            git commit -m "Temporary 3D logo clarity live audit report"
            git push origin HEAD:main
          fi
      - name: Strict result
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.syntax.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
          node -e "const x=require('./.github/vikey-logo-clarity-live-result-temp.json');if(!x.passed)process.exit(1)"
