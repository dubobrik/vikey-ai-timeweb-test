name: Inspect Tarhankut live site

on:
  push:
    branches:
      - audit-tarhankut-live-source
    paths:
      - '.github/workflows/inspect-tarhankut-live.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect tarhankut.space
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const response = await page.goto('https://tarhankut.space/', { waitUntil: 'networkidle', timeout: 120000 });
          console.log('HTTP_STATUS='+response?.status());
          console.log('FINAL_URL='+page.url());
          console.log('TITLE='+await page.title());

          const data = await page.evaluate(() => {
            const clean = s => (s || '').replace(/\s+/g,' ').trim();
            const anchors = [...document.querySelectorAll('a')].map(a => ({
              text: clean(a.textContent),
              href: a.href,
              target: a.getAttribute('target'),
            })).filter(x => x.text || x.href);
            const headings = [...document.querySelectorAll('h1,h2,h3')].map(h => ({
              tag: h.tagName,
              text: clean(h.textContent)
            }));
            const buttons = [...document.querySelectorAll('button')].map(b => clean(b.textContent)).filter(Boolean);
            const forms = [...document.querySelectorAll('form')].map(f => ({
              action: f.getAttribute('action'),
              method: f.getAttribute('method'),
              inputs: [...f.querySelectorAll('input,select,textarea')].map(i => ({
                tag:i.tagName, type:i.getAttribute('type'), name:i.getAttribute('name'), placeholder:i.getAttribute('placeholder')
              }))
            }));
            const iframes = [...document.querySelectorAll('iframe')].map(i => i.src);
            const imgs = [...document.querySelectorAll('img')].map(i => ({
              alt: i.alt,
              src: i.currentSrc || i.src,
              width: i.naturalWidth,
              height: i.naturalHeight
            })).slice(0,80);
            return {
              bodyText: clean(document.body.innerText).slice(0,20000),
              headings, anchors, buttons, forms, iframes, imgs
            };
          });

          console.log('HEADINGS_JSON='+JSON.stringify(data.headings));
          console.log('ANCHORS_JSON='+JSON.stringify(data.anchors));
          console.log('BUTTONS_JSON='+JSON.stringify(data.buttons));
          console.log('FORMS_JSON='+JSON.stringify(data.forms));
          console.log('IFRAMES_JSON='+JSON.stringify(data.iframes));
          console.log('IMAGES_JSON='+JSON.stringify(data.imgs));
          console.log('BODY_TEXT_BEGIN');
          console.log(data.bodyText);
          console.log('BODY_TEXT_END');
          await browser.close();
          NODE

      - name: Remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-tarhankut-live.yml
          git commit -m "Remove Tarhankut live inspection workflow"
          git push
