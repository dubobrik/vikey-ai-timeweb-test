name: Verify packaging paragraph live

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-packaging-paragraph-live.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Production build
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          page='.output/public/upakovka-proekta/index.html'
          test -f "$page"
          grep -aFq 'Задача упаковки — сделать профессиональную услугу понятной для B2B-коммуникации и подготовить материалы для первичного выхода на компании. Дальнейший результат зависит от самого предложения, продаж и работы с клиентами.' "$page"
          ! grep -aFq 'В кейсе не используются обещания гарантированного психологического результата, снижения текучести или финансового эффекта: задача упаковки — сделать услугу понятной для B2B-коммуникации и подготовить материалы для выхода на рынок.' "$page"

      - name: Wait for Timeweb deploy and verify live
        run: |
          set -euo pipefail
          url='https://chelovek-neiroset.ru/upakovka-proekta/'
          for i in $(seq 1 180); do
            if curl -fsSL -H 'Accept-Encoding: identity' "$url" -o /tmp/page.html \
              && grep -aFq 'Задача упаковки — сделать профессиональную услугу понятной для B2B-коммуникации и подготовить материалы для первичного выхода на компании. Дальнейший результат зависит от самого предложения, продаж и работы с клиентами.' /tmp/page.html \
              && ! grep -aFq 'В кейсе не используются обещания гарантированного психологического результата, снижения текучести или финансового эффекта: задача упаковки — сделать услугу понятной для B2B-коммуникации и подготовить материалы для выхода на рынок.' /tmp/page.html; then
              echo "DEPLOY_READY_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for Timeweb deployment'
          exit 1

      - name: Remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-packaging-paragraph-live.yml
          git commit -m "Remove packaging paragraph verification workflow"
          git push
