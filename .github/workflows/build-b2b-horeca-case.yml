name: Build B2B HoReCa SEO case

on:
  push:
    branches:
      - seo-case-b2b-horeca
    paths:
      - '.github/workflows/build-b2b-horeca-case.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Production build and source checks
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          page='.output/public/case-b2b-horeca/index.html'
          test -f "$page"
          grep -aFq 'Позиционирование B2B-услуги для HoReCa — кейс Vikey AI' "$page"
          grep -aFq 'Кейс Vikey AI: исследование HoReCa, позиционирование B2B-услуги, сегментация ЛПР, презентационные материалы, карта продаж и база компаний для первичного выхода.' "$page"
          grep -aFq 'name="robots" content="index,follow"' "$page"
          grep -aFq 'rel="canonical" href="https://chelovek-neiroset.ru/case-b2b-horeca/"' "$page"
          grep -aFq 'property="og:url" content="https://chelovek-neiroset.ru/case-b2b-horeca/"' "$page"
          test "$(grep -ao '<h1' "$page" | wc -l)" -eq 1
          grep -aFq 'Позиционирование B2B-услуги для HoReCa' "$page"
          grep -aFq 'психолога со стажем более 20 лет' "$page"
          grep -aFq 'Исследование сегмента HoReCa' "$page"
          grep -aFq 'Продуктовая логика B2B-услуги' "$page"
          grep -aFq 'Сегментация ЛПР' "$page"
          grep -aFq 'Презентационные материалы' "$page"
          grep -aFq 'Карта продаж и логика первого контакта' "$page"
          grep -aFq 'В рамках проекта была собрана база потенциальных компаний и контактов для первичного выхода.' "$page"
          grep -aFq 'href="/upakovka-proekta/"' "$page"
          grep -aFq 'href="/#calc"' "$page"
          grep -aFq 'https://t.me/Vikey_shel' "$page"
          grep -aFq 'https://wa.me/79081747077' "$page"
          grep -aFq 'https://max.ru/u/f9LHodD0cOKqFcs6UZJNI7fMntxJ8xCv4X4bwued0XRebPD3LFvJ6CgS3cA' "$page"
          test "$(grep -ao '<details' "$page" | wc -l)" -eq 6
          ! grep -aFqi 'ROI' "$page"
          ! grep -aFqi 'снизили текучесть' "$page"
          ! grep -aFqi 'снизили выгорание' "$page"
          ! grep -aFqi 'увеличили прибыль' "$page"
          ! grep -aFqi 'повысили продажи' "$page"
          test -f src/assets/b2b-horeca-modal.webp
          echo "HORECA_MODAL_BYTES=$(stat -c%s src/assets/b2b-horeca-modal.webp)"
          test "$(grep -c '<loc>' public/sitemap.xml)" -eq 10
          grep -Fq '<loc>https://chelovek-neiroset.ru/case-b2b-horeca/</loc>' public/sitemap.xml
          grep -Fq 'href="/case-b2b-horeca/"' src/routes/upakovka-proekta.tsx
          grep -Fq 'caseHref: "/case-b2b-horeca/"' src/routes/index.tsx
          grep -Fq 'Sitemap: https://chelovek-neiroset.ru/sitemap.xml' public/robots.txt
          ! grep -RniE 'navigator\.serviceWorker|serviceWorker\.register|vite-plugin-pwa|workbox' src package.json vite.config.ts

      - name: Commit generated route tree and remove workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git rm .github/workflows/build-b2b-horeca-case.yml
          git commit -m "Generate B2B HoReCa route tree and finish verification"
          git push
