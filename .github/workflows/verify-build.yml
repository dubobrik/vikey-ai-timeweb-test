name: Verify static prerender build

on:
  push:
    paths:
      - ".github/workflows/verify-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install, build and verify static HTML
        shell: bash
        run: |
          set +e
          {
            echo "=== bun install --frozen-lockfile ==="
            bun install --frozen-lockfile
            install_code=$?
            echo
            echo "Install exit code: $install_code"

            if [ "$install_code" -eq 0 ]; then
              echo
              echo "=== bun run build ==="
              bun run build
              build_code=$?
            else
              build_code=99
            fi

            static_code=99
            if [ "$build_code" -eq 0 ]; then
              echo
              echo "=== verify prerendered HTML ==="
              if [ -f .output/public/index.html ] && [ -f .output/public/privacy/index.html ]; then
                echo "Found .output/public/index.html"
                echo "Found .output/public/privacy/index.html"
                static_code=0
              else
                echo "Missing expected prerendered HTML files"
                find .output/public -maxdepth 3 -type f | sort | head -n 120 || true
                static_code=1
              fi
            fi

            echo
            echo "Build exit code: $build_code"
            echo "Static prerender verification exit code: $static_code"
          } > BUILD_LOG.txt 2>&1

          if [ "$install_code" -eq 0 ] && [ "$build_code" -eq 0 ] && [ "$static_code" -eq 0 ]; then
            printf "Static prerender production build: OK\nRoot HTML: OK\nPrivacy HTML: OK\nFinal Lovable cleanup verified: YES\nCommit: %s\n" "$GITHUB_SHA" > BUILD_CHECK.txt
          else
            printf "Static prerender production build: FAILED\nInstall exit code: %s\nBuild exit code: %s\nStatic verification exit code: %s\nCommit: %s\n" "$install_code" "$build_code" "$static_code" "$GITHUB_SHA" > BUILD_CHECK.txt
          fi

          cat BUILD_CHECK.txt
          tail -n 200 BUILD_LOG.txt || true

      - name: Commit build result
        if: always()
        run: |
          git config user.name "ChatGPT migration"
          git config user.email "actions@users.noreply.github.com"
          git add BUILD_CHECK.txt BUILD_LOG.txt
          git commit -m "Verify static prerender production build" || true
          git push || true

# static prerender verification
