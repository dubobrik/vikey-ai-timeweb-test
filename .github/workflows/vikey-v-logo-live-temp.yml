name: Temporary Vikey 3D logo browser audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vikey-v-logo-live-temp.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        id: install
        continue-on-error: true
        run: |
          npm install --prefix /tmp/vikey-logo-browser --no-save playwright
          /tmp/vikey-logo-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify audit JS syntax
        id: syntax
        continue-on-error: true
        run: node --check .github/vikey-v-logo-live-temp.cjs
      - name: Verify live model in browser
        id: audit
        if: steps.install.outcome == 'success' && steps.syntax.outcome == 'success'
        continue-on-error: true
        env:
          NODE_PATH: /tmp/vikey-logo-browser/node_modules
        run: node .github/vikey-v-logo-live-temp.cjs
      - name: Store temporary audit result
        if: always()
        run: |
          if [ ! -f .github/vikey-v-logo-live-report-temp.json ]; then
            echo '{"passed":false,"errors":["No browser result"]}' > .github/vikey-v-logo-live-report-temp.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/vikey-v-logo-live-report-temp.json
          if ! git diff --cached --quiet; then
            git commit -m "Temporary 3D logo live audit report"
            git push origin HEAD:main
          fi
      - name: Strict status
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.syntax.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
          node -e "const r=require('./.github/vikey-v-logo-live-report-temp.json');if(!r.passed)process.exit(1)"
