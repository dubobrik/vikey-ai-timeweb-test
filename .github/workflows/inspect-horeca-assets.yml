name: Inspect HoReCa assets

on:
  push:
    branches:
      - seo-case-b2b-horeca
    paths:
      - '.github/workflows/inspect-horeca-assets.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect assets
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          for p in ['src/assets/b2b-horeca-card.webp','src/assets/b2b-horeca-modal.webp']:
              with Image.open(p) as im:
                  print(f'{p}: {im.width}x{im.height} {os.path.getsize(p)} bytes')
          PY
      - name: Remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-horeca-assets.yml
          git commit -m "Remove HoReCa asset inspection workflow"
          git push
