name: Temporary TanStack route generation check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vikey-route-check-temp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-route:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Production build and route verification
        run: |
          bun run build
          test -f src/routeTree.gen.ts
          grep -Fq '/case-ai-telegram-bot' src/routeTree.gen.ts
          echo "ROUTE_GENERATED=YES"
      - name: Commit only generated route tree if changed
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routeTree.gen.ts
            git commit -m "Generate TanStack route tree for AI Telegram case"
            git push origin HEAD:main
          fi
          git status --short
