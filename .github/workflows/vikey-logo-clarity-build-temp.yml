name: Temporary 3D logo clarity build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vikey-logo-clarity-build-temp.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build production and confirm homepage structure
        id: build
        continue-on-error: true
        run: |
          bun install --frozen-lockfile
          bun run build
          test "$(grep -c '<loc>' public/sitemap.xml)" -eq 16
          grep -Fq 'sm:h-52 sm:w-52' src/components/InteractiveVLogo.tsx
          test -s public/models/vikey-v-logo.glb
      - name: Record temporary build status
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then echo '{"passed":true}' > .github/vikey-logo-clarity-build-result-temp.json; else echo '{"passed":false}' > .github/vikey-logo-clarity-build-result-temp.json; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/vikey-logo-clarity-build-result-temp.json
          git commit -m "Temporary 3D logo clarity build result"
          git push origin HEAD:main
      - name: Enforce build
        if: always()
        run: test "${{ steps.build.outcome }}" = "success"
