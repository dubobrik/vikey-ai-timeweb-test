name: Verify SEO business page live

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-seo-business-page-live.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for Timeweb deploy
        run: |
          set -euo pipefail
          url="https://chelovek-neiroset.ru/sayty-dlya-biznesa/"
          for i in $(seq 1 40); do
            if body=$(curl -fsSL "$url" 2>/dev/null) && printf '%s' "$body" | grep -Fq 'Создание сайтов для бизнеса под ключ'; then
              echo "DEPLOY_READY_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "Timed out waiting for Timeweb deployment"
              exit 1
            fi
            sleep 10
          done

      - name: Verify URL metadata sitemap and existing pages
        run: |
          set -euo pipefail
          url="https://chelovek-neiroset.ru/sayty-dlya-biznesa/"
          curl -fsSL "$url" -o /tmp/page.html
          grep -Fq 'Создание сайтов для бизнеса с SEO-подготовкой | Vikey AI' /tmp/page.html
          grep -Fq 'Создаю сайты и лендинги для бизнеса и услуг: структура, мобильная адаптация, визуальная упаковка и SEO-подготовка. Реальные проекты Vikey AI.' /tmp/page.html
          grep -Fq 'index,follow' /tmp/page.html
          grep -Fq 'https://chelovek-neiroset.ru/sayty-dlya-biznesa/' /tmp/page.html
          grep -Fq 'Создание сайтов для бизнеса под ключ' /tmp/page.html
          if grep -Eqi 'noindex' /tmp/page.html; then echo 'Unexpected noindex'; exit 1; fi

          code_slash=$(curl -sS -o /dev/null -w '%{http_code}' "$url")
          test "$code_slash" = "200"
          no_slash_headers=$(curl -sS -o /dev/null -D - https://chelovek-neiroset.ru/sayty-dlya-biznesa)
          printf '%s' "$no_slash_headers" | grep -Fq '308'
          printf '%s' "$no_slash_headers" | grep -Eqi 'location: /sayty-dlya-biznesa/'
          final_no_slash=$(curl -sS -L -o /dev/null -w '%{url_effective}' https://chelovek-neiroset.ru/sayty-dlya-biznesa)
          test "$final_no_slash" = "$url"

          curl -fsSL https://chelovek-neiroset.ru/ -o /tmp/home.html
          grep -Fq 'href="/sayty-dlya-biznesa/"' /tmp/home.html
          curl -fsSL https://chelovek-neiroset.ru/privacy/ >/dev/null

          curl -fsSL https://chelovek-neiroset.ru/sitemap.xml -o /tmp/sitemap.xml
          test "$(grep -c '<loc>' /tmp/sitemap.xml)" -eq 3
          grep -Fq '<loc>https://chelovek-neiroset.ru/</loc>' /tmp/sitemap.xml
          grep -Fq '<loc>https://chelovek-neiroset.ru/privacy</loc>' /tmp/sitemap.xml
          grep -Fq '<loc>https://chelovek-neiroset.ru/sayty-dlya-biznesa/</loc>' /tmp/sitemap.xml
          curl -fsSL https://chelovek-neiroset.ru/robots.txt | grep -Fq 'Sitemap: https://chelovek-neiroset.ru/sitemap.xml'

      - name: Browser checks iPhone Android desktop
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const target = 'https://chelovek-neiroset.ru/sayty-dlya-biznesa/';
          const profiles = [
            ['iPhone', { width: 390, height: 844 }, true, 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'],
            ['Android', { width: 412, height: 915 }, true, 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36 Chrome/140.0.0.0 Mobile Safari/537.36'],
            ['Desktop', { width: 1440, height: 900 }, false, 'Mozilla/5.0 Chrome/140.0.0.0 Safari/537.36'],
          ];
          for (const [name, viewport, isMobile, userAgent] of profiles) {
            const context = await browser.newContext({ viewport, isMobile, hasTouch: isMobile, userAgent });
            const page = await context.newPage();
            const response = await page.goto(target, { waitUntil: 'networkidle' });
            if (!response || response.status() !== 200) throw new Error(`${name}: HTTP 200 failed`);
            await page.reload({ waitUntil: 'networkidle' });
            const h1s = await page.locator('h1').allTextContents();
            if (h1s.length !== 1 || !h1s[0].includes('Создание сайтов для бизнеса под ключ')) throw new Error(`${name}: H1 failed`);
            const dims = await page.evaluate(() => ({ sw: document.documentElement.scrollWidth, cw: document.documentElement.clientWidth }));
            if (dims.sw > dims.cw + 1) throw new Error(`${name}: horizontal overflow ${dims.sw}/${dims.cw}`);
            const imagesOk = await page.locator('#cases img').evaluateAll((imgs) => imgs.length === 4 && imgs.every((img) => img.getAttribute('loading') === 'lazy' && img.hasAttribute('width') && img.hasAttribute('height') && !!img.getAttribute('alt')));
            if (!imagesOk) throw new Error(`${name}: case image attributes failed`);
            if (await page.locator('a[href="/#contact"]').count() < 1) throw new Error(`${name}: contact CTA missing`);
            if (await page.locator('a[href="/#calc"]').count() !== 1) throw new Error(`${name}: calculator CTA missing`);
            await context.close();
            console.log(`${name}: OK`);
          }
          await browser.close();
          NODE

      - name: Remove temporary workflow
        if: always()
        run: |
          if [ -f .github/workflows/verify-seo-business-page-live.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/verify-seo-business-page-live.yml
            git commit -m "Remove SEO business page live verification workflow"
            git push
          fi
