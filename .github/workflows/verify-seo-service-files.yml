name: Verify SEO service files

on:
  push:
    paths:
      - .github/workflows/verify-seo-service-files.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify production build
        run: |
          bun run build
          test -f .output/public/sitemap.xml
          test -f .output/public/robots.txt
          diff -u public/sitemap.xml .output/public/sitemap.xml
          diff -u public/robots.txt .output/public/robots.txt

      - name: Verify sitemap contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('.output/public/sitemap.xml')
          root = ET.fromstring(p.read_text(encoding='utf-8'))
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [x.text for x in root.findall('sm:url/sm:loc', ns)]
          expected = ['https://chelovek-neiroset.ru/', 'https://chelovek-neiroset.ru/privacy']
          assert urls == expected, f'Unexpected sitemap URLs: {urls}'
          PY

      - name: Wait for Timeweb deploy and verify live URLs
        run: |
          set -e
          SITEMAP_URL='https://chelovek-neiroset.ru/sitemap.xml'
          ROBOTS_URL='https://chelovek-neiroset.ru/robots.txt'
          for i in $(seq 1 24); do
            s=$(curl -fsSL --max-time 15 "$SITEMAP_URL" || true)
            r=$(curl -fsSL --max-time 15 "$ROBOTS_URL" || true)
            if printf '%s' "$s" | grep -Fq '<loc>https://chelovek-neiroset.ru/</loc>' \
              && printf '%s' "$s" | grep -Fq '<loc>https://chelovek-neiroset.ru/privacy</loc>' \
              && [ "$(printf '%s' "$s" | grep -o '<loc>' | wc -l)" -eq 2 ] \
              && printf '%s' "$r" | grep -Fq 'User-agent: *' \
              && printf '%s' "$r" | grep -Fq 'Allow: /' \
              && printf '%s' "$r" | grep -Fq 'Sitemap: https://chelovek-neiroset.ru/sitemap.xml'; then
              echo 'Live SEO files verified successfully.'
              exit 0
            fi
            echo "Waiting for deploy... attempt $i/24"
            sleep 10
          done
          echo 'Live verification failed after waiting for deploy.' >&2
          exit 1

      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-seo-service-files.yml
          git commit -m "Remove temporary SEO verification workflow"
          git push
