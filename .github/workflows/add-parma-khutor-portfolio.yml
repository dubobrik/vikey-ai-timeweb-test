name: Add Parma Khutor portfolio case

on:
  push:
    paths:
      - .github/workflows/add-parma-khutor-portfolio.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add portfolio cover
        run: |
          mkdir -p public/assets
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/dubobrik/parma-khutor-timeweb/main/public/assets/grounds-hammock.webp -o public/assets/parma-khutor-portfolio.webp

      - name: Add Parma Khutor case
        env:
          CASE_B64: ""
          MARK_B64: "ICAgIHZpZXdIcmVmOiAiaHR0cHM6Ly90YXJoYW5rdXQuc3BhY2UvIiwKICAgIHZpZXdMYWJlbDogItCf0L7RgdC80L7RgtGA0LXRgtGMINGB0LDQudGCIiwKICB9LAo="
        run: |
          python -c 'import os,base64; from pathlib import Path; p=Path("src/routes/index.tsx"); t=p.read_text(encoding="utf-8"); m=base64.b64decode(os.environ["MARK_B64"]).decode("utf-8"); c=base64.b64decode(os.environ["CASE_B64"]).decode("utf-8"); assert m in t, "Insertion marker not found"; p.write_text(t if "/assets/parma-khutor-portfolio.webp" in t else t.replace(m,m+c,1), encoding="utf-8")'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/add-parma-khutor-portfolio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Parma Khutor portfolio case"
          git push
