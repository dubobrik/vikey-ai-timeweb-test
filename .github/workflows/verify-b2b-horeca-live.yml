name: Verify B2B HoReCa case live

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-b2b-horeca-live.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Production build on main
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          test -f .output/public/case-b2b-horeca/index.html

      - name: Wait for Timeweb deploy
        run: |
          set -euo pipefail
          url='https://chelovek-neiroset.ru/case-b2b-horeca/'
          for i in $(seq 1 180); do
            if curl -fsSL -H 'Accept-Encoding: identity' "$url" -o /tmp/page.html \
              && grep -aFq 'Позиционирование B2B-услуги для HoReCa' /tmp/page.html \
              && grep -aFq 'В рамках проекта была собрана база потенциальных компаний и контактов для первичного выхода.' /tmp/page.html \
              && grep -aFq 'https://t.me/Vikey_shel' /tmp/page.html; then
              echo "DEPLOY_READY_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for Timeweb deployment'
          exit 1

      - name: Verify HTTP SEO links sitemap image and regressions
        run: |
          set -euo pipefail
          url='https://chelovek-neiroset.ru/case-b2b-horeca/'
          curl -fsSL -H 'Accept-Encoding: identity' "$url" -o /tmp/page.html

          test "$(curl -sS -o /dev/null -w '%{http_code}' "$url")" = '200'
          grep -aFq 'Позиционирование B2B-услуги для HoReCa — кейс Vikey AI' /tmp/page.html
          grep -aFq 'Кейс Vikey AI: исследование HoReCa, позиционирование B2B-услуги, сегментация ЛПР, презентационные материалы, карта продаж и база компаний для первичного выхода.' /tmp/page.html
          grep -aFq 'name="robots" content="index,follow"' /tmp/page.html
          grep -aFq 'rel="canonical" href="https://chelovek-neiroset.ru/case-b2b-horeca/"' /tmp/page.html
          grep -aFq 'property="og:url" content="https://chelovek-neiroset.ru/case-b2b-horeca/"' /tmp/page.html
          test "$(grep -ao '<h1' /tmp/page.html | wc -l)" -eq 1
          grep -aFq '<h1' /tmp/page.html
          grep -aFq 'Позиционирование B2B-услуги для HoReCa' /tmp/page.html

          grep -aFq 'психолога со стажем более 20 лет' /tmp/page.html
          grep -aFq 'Исследование сегмента HoReCa' /tmp/page.html
          grep -aFq 'Продуктовая логика B2B-услуги' /tmp/page.html
          grep -aFq 'Сегментация ЛПР' /tmp/page.html
          grep -aFq 'Презентационные материалы' /tmp/page.html
          grep -aFq 'Карта продаж и логика первого контакта' /tmp/page.html
          grep -aFq 'В рамках проекта была собрана база потенциальных компаний и контактов для первичного выхода.' /tmp/page.html
          ! grep -aFqi 'ROI' /tmp/page.html
          ! grep -aFqi 'снизили текучесть' /tmp/page.html
          ! grep -aFqi 'снизили выгорание' /tmp/page.html
          ! grep -aFqi 'увеличили прибыль' /tmp/page.html
          ! grep -aFqi 'повысили продажи' /tmp/page.html

          grep -aFq 'href="/upakovka-proekta/"' /tmp/page.html
          grep -aFq 'href="/#calc"' /tmp/page.html
          grep -aFq 'https://t.me/Vikey_shel' /tmp/page.html
          grep -aFq 'https://wa.me/79081747077' /tmp/page.html
          grep -aFq 'https://max.ru/u/f9LHodD0cOKqFcs6UZJNI7fMntxJ8xCv4X4bwued0XRebPD3LFvJ6CgS3cA' /tmp/page.html
          test "$(grep -ao '<details' /tmp/page.html | wc -l)" -eq 6
          grep -aFq 'width="1400"' /tmp/page.html
          grep -aFq 'height="788"' /tmp/page.html
          grep -aFq 'B2B-упаковка услуги психологической поддержки для HoReCa — кейс Vikey AI' /tmp/page.html

          headers=$(curl -sS -o /dev/null -D - https://chelovek-neiroset.ru/case-b2b-horeca)
          printf '%s' "$headers" | grep -Fq '308'
          printf '%s' "$headers" | grep -Eqi 'location: /case-b2b-horeca/'
          final_url=$(curl -sS -L -o /dev/null -w '%{url_effective}' https://chelovek-neiroset.ru/case-b2b-horeca)
          test "$final_url" = "$url"

          curl -fsSL -H 'Accept-Encoding: identity' https://chelovek-neiroset.ru/ -o /tmp/home.html
          grep -aFq 'href="/case-b2b-horeca/"' /tmp/home.html
          grep -aFq 'B2B-упаковка услуги психологической поддержки для HoReCa' /tmp/home.html

          curl -fsSL -H 'Accept-Encoding: identity' https://chelovek-neiroset.ru/upakovka-proekta/ -o /tmp/upakovka.html
          grep -aFq 'href="/case-b2b-horeca/"' /tmp/upakovka.html
          grep -aFq 'Подробнее о кейсе' /tmp/upakovka.html

          curl -fsSL https://chelovek-neiroset.ru/sitemap.xml -o /tmp/sitemap.xml
          test "$(grep -c '<loc>' /tmp/sitemap.xml)" -eq 10
          grep -Fq '<loc>https://chelovek-neiroset.ru/</loc>' /tmp/sitemap.xml
          grep -Fq '<loc>https://chelovek-neiroset.ru/privacy</loc>' /tmp/sitemap.xml
          grep -Fq '<loc>https://chelovek-neiroset.ru/sayty-dlya-biznesa/</loc>' /tmp/sitemap.xml
          grep -Fq '<loc>https://chelovek-neiroset.ru/ii-assistent-dlya-biznesa/</loc>' /tmp/sitemap.xml
          grep -Fq '<loc>https://chelovek-neiroset.ru/telegram-boty-dlya-biznesa/</loc>' /tmp/sitemap.xml
          grep -Fq '<loc>https://chelovek-neiroset.ru/avtomatizaciya-biznesa-ai/</loc>' /tmp/sitemap.xml
          grep -Fq '<loc>https://chelovek-neiroset.ru/ai-video-dlya-biznesa/</loc>' /tmp/sitemap.xml
          grep -Fq '<loc>https://chelovek-neiroset.ru/upakovka-proekta/</loc>' /tmp/sitemap.xml
          grep -Fq '<loc>https://chelovek-neiroset.ru/case-sayt-gostevye-domiki/</loc>' /tmp/sitemap.xml
          grep -Fq '<loc>https://chelovek-neiroset.ru/case-b2b-horeca/</loc>' /tmp/sitemap.xml
          curl -fsSL https://chelovek-neiroset.ru/robots.txt | grep -Fq 'Sitemap: https://chelovek-neiroset.ru/sitemap.xml'

          for existing in \
            'https://chelovek-neiroset.ru/' \
            'https://chelovek-neiroset.ru/privacy' \
            'https://chelovek-neiroset.ru/sayty-dlya-biznesa/' \
            'https://chelovek-neiroset.ru/ii-assistent-dlya-biznesa/' \
            'https://chelovek-neiroset.ru/telegram-boty-dlya-biznesa/' \
            'https://chelovek-neiroset.ru/avtomatizaciya-biznesa-ai/' \
            'https://chelovek-neiroset.ru/ai-video-dlya-biznesa/' \
            'https://chelovek-neiroset.ru/upakovka-proekta/' \
            'https://chelovek-neiroset.ru/case-sayt-gostevye-domiki/' \
            'https://chelovek-neiroset.ru/case-b2b-horeca/'; do
            test "$(curl -sS -L -o /dev/null -w '%{http_code}' "$existing")" = '200'
          done

          image_url=$(grep -aoE 'src="[^"]*b2b-horeca-modal[^"]*\.webp"' /tmp/page.html | head -1 | cut -d'"' -f2)
          test -n "$image_url"
          case "$image_url" in
            http*) image_full="$image_url" ;;
            /*) image_full="https://chelovek-neiroset.ru$image_url" ;;
            *) image_full="https://chelovek-neiroset.ru/$image_url" ;;
          esac
          image_headers=$(curl -sSI "$image_full")
          printf '%s' "$image_headers" | grep -Eqi '^content-type: image/webp'
          echo "LIVE_HORECA_ASSET_URL=$image_full"
          echo "LIVE_HORECA_ASSET_BYTES=$(curl -fsSL "$image_full" | wc -c)"

          ! grep -RniE 'navigator\.serviceWorker|serviceWorker\.register|vite-plugin-pwa|workbox' src package.json vite.config.ts

      - name: Browser checks desktop and mobile
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const target='https://chelovek-neiroset.ru/case-b2b-horeca/';
          const profiles=[
            ['iPhone',{width:390,height:844},true,'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'],
            ['Android',{width:412,height:915},true,'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36 Chrome/140.0.0.0 Mobile Safari/537.36'],
            ['Desktop',{width:1440,height:900},false,'Mozilla/5.0 Chrome/140.0.0.0 Safari/537.36'],
          ];

          for (const [name,viewport,isMobile,userAgent] of profiles) {
            const context=await browser.newContext({viewport,isMobile,hasTouch:isMobile,userAgent});
            const p=await context.newPage();
            await p.addInitScript(()=>{
              window.__clsValue=0;
              try {
                new PerformanceObserver(list=>{
                  for(const e of list.getEntries()) if(!e.hadRecentInput) window.__clsValue+=e.value;
                }).observe({type:'layout-shift',buffered:true});
              } catch {}
            });

            let r=await p.goto(target,{waitUntil:'networkidle'});
            if(!r||r.status()!==200) throw new Error(name+' HTTP');
            r=await p.reload({waitUntil:'networkidle'});
            if(!r||r.status()!==200) throw new Error(name+' refresh');

            const tab=await context.newPage();
            const tr=await tab.goto(target,{waitUntil:'domcontentloaded'});
            if(!tr||tr.status()!==200) throw new Error(name+' new tab');
            await tab.close();

            const h1=await p.locator('h1').allTextContents();
            if(h1.length!==1||h1[0].trim()!=='Позиционирование B2B-услуги для HoReCa') throw new Error(name+' H1');

            const dims=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
            if(dims.sw>dims.cw+1) throw new Error(name+' horizontal overflow '+dims.sw+'/'+dims.cw);
            const cls=await p.evaluate(()=>window.__clsValue||0);
            if(cls>0.1) throw new Error(name+' CLS '+cls);

            if(await p.locator('details').count()!==6) throw new Error(name+' FAQ');
            if(await p.locator('footer').count()!==1) throw new Error(name+' footer');
            const headerPosition=await p.locator('header').evaluate(el=>getComputedStyle(el).position);
            if(headerPosition!=='sticky') throw new Error(name+' header');

            const image=p.locator('img[alt="B2B-упаковка услуги психологической поддержки для HoReCa — кейс Vikey AI"]');
            if(await image.count()!==1) throw new Error(name+' hero image');
            const box=await image.boundingBox();
            if(!box||box.width<=0||box.height<=0) throw new Error(name+' hero image layout');

            const links=[
              '#work','/#contact','/upakovka-proekta/','/#calc',
              'https://t.me/Vikey_shel','https://wa.me/79081747077',
              'https://max.ru/u/f9LHodD0cOKqFcs6UZJNI7fMntxJ8xCv4X4bwued0XRebPD3LFvJ6CgS3cA'
            ];
            for(const href of links){
              if(await p.locator(`a[href="${href}"]`).count()<1) throw new Error(name+' missing '+href);
            }

            for(const term of ['Позиционирование B2B-услуги','Сегментация ЛПР','Продуктовая логика B2B-услуги','Презентационные материалы','Карта продаж и логика первого контакта','База компаний для первичного выхода']){
              if(await p.getByText(term,{exact:false}).count()<1) throw new Error(name+' missing term '+term);
            }
            console.log(name+': OK CLS='+cls);
            await context.close();
          }

          const home=await browser.newPage({viewport:{width:1440,height:900}});
          await home.goto('https://chelovek-neiroset.ru/',{waitUntil:'networkidle'});
          const card=home.locator('div.group').filter({hasText:'B2B-упаковка услуги психологической поддержки для HoReCa'}).first();
          if(await card.count()!==1) throw new Error('Home B2B card missing');
          if(await card.locator('a[href="/case-b2b-horeca/"]').count()!==1) throw new Error('Home case link missing');
          if(await card.getByRole('button',{name:'Что сделано'}).count()!==1) throw new Error('Home modal helper button missing');
          console.log('Home B2B portfolio: OK');
          await home.close();

          const up=await browser.newPage({viewport:{width:1440,height:900}});
          await up.goto('https://chelovek-neiroset.ru/upakovka-proekta/',{waitUntil:'networkidle'});
          if(await up.locator('a[href="/case-b2b-horeca/"]').count()<1) throw new Error('Packaging incoming link missing');
          console.log('Packaging backlink: OK');
          await up.close();

          await browser.close();
          NODE

      - name: Remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-b2b-horeca-live.yml
          git commit -m "Remove B2B HoReCa live verification workflow"
          git push
