name: Build automation SEO branch

on:
  push:
    branches:
      - seo-avtomatizaciya-biznesa-ai
    paths:
      - '.github/workflows/build-automation-seo-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Production build
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          test -f .output/public/avtomatizaciya-biznesa-ai/index.html
          grep -aFq 'Автоматизация бизнес-процессов с ИИ' .output/public/avtomatizaciya-biznesa-ai/index.html
          grep -aFq 'index,follow' .output/public/avtomatizaciya-biznesa-ai/index.html
          grep -aFq 'https://chelovek-neiroset.ru/avtomatizaciya-biznesa-ai/' .output/public/avtomatizaciya-biznesa-ai/index.html
          test "$(grep -ao '<h1' .output/public/avtomatizaciya-biznesa-ai/index.html | wc -l)" -eq 1
          test "$(grep -c '<loc>' public/sitemap.xml)" -eq 6
          grep -Fq '<loc>https://chelovek-neiroset.ru/avtomatizaciya-biznesa-ai/</loc>' public/sitemap.xml
          ! grep -RniE 'navigator\.serviceWorker|serviceWorker\.register|vite-plugin-pwa|workbox' src package.json vite.config.ts

      - name: Commit generated route tree and remove workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git rm .github/workflows/build-automation-seo-branch.yml
          git commit -m "Generate automation route tree and finish branch verification"
          git push
