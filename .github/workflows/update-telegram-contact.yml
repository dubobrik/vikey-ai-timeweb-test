name: Update Telegram contact

on:
  push:
    paths:
      - .github/workflows/update-telegram-contact.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Telegram contact
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "https://t.me/Vikey_shel"
          new = "https://t.me/vikey_shell"
          files = [
              Path("src/routes/index.tsx"),
              Path("src/components/AiConsultantWidget.tsx"),
          ]

          total = 0
          for path in files:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"Old Telegram URL not found in {path}")
              path.write_text(text.replace(old, new), encoding="utf-8")
              total += count
              print(f"{path}: replaced {count}")

          if total != 4:
              raise SystemExit(f"Expected 4 replacements, got {total}")
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify production build
        run: bun run build

      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/update-telegram-contact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Telegram contact to @vikey_shell"
          git push
