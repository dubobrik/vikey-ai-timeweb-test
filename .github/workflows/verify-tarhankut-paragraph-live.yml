name: Verify Tarhankut paragraph live

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-tarhankut-paragraph-live.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Production build
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          page='.output/public/case-sayt-gostevye-domiki/index.html'
          test -f "$page"
          grep -aFq 'На сайте нет отдельной системы онлайн-бронирования: основной сценарий — перейти к контакту и уточнить свободные даты.' "$page"
          ! grep -aFq 'В кейсе сознательно не заявляется отдельная система онлайн-бронирования: на опубликованном проекте ключевой сценарий сформулирован как путь к контакту и уточнению доступности.' "$page"

      - name: Wait for Timeweb deploy and verify live
        run: |
          set -euo pipefail
          url='https://chelovek-neiroset.ru/case-sayt-gostevye-domiki/'
          for i in $(seq 1 180); do
            if curl -fsSL -H 'Accept-Encoding: identity' "$url" -o /tmp/page.html \
              && grep -aFq 'На сайте нет отдельной системы онлайн-бронирования: основной сценарий — перейти к контакту и уточнить свободные даты.' /tmp/page.html \
              && ! grep -aFq 'В кейсе сознательно не заявляется отдельная система онлайн-бронирования: на опубликованном проекте ключевой сценарий сформулирован как путь к контакту и уточнению доступности.' /tmp/page.html; then
              echo "DEPLOY_READY_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for Timeweb deployment'
          exit 1

      - name: Remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-tarhankut-paragraph-live.yml
          git commit -m "Remove Tarhankut paragraph verification workflow"
          git push
