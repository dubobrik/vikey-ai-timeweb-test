name: Optimize AI video poster

on:
  push:
    branches:
      - seo-ai-video-dlya-biznesa
    paths:
      - '.github/workflows/optimize-ai-video-poster.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Optimize poster
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          src='src/assets/digital-avatar-poster.jpg'
          dst='src/assets/digital-avatar-poster.webp'
          with Image.open(src) as im:
              im.save(dst, 'WEBP', quality=84, method=6)
              print(f'POSTER_DIMENSIONS={im.width}x{im.height}')
          print(f'WEBP_SIZE_BYTES={os.path.getsize(dst)}')
          PY
      - name: Commit optimized poster and remove workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/digital-avatar-poster.webp
          git rm .github/workflows/optimize-ai-video-poster.yml
          git commit -m "Optimize digital avatar poster WebP"
          git push
