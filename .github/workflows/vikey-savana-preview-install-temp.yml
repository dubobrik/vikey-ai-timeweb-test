name: Temporary Savana portfolio preview update
on:
  push:
    branches: [main]
    paths:
      - 'Vikey_Savana_Preview_Update.zip'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Validate and extract supplied preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archive=Path('Vikey_Savana_Preview_Update.zip')
          assert archive.is_file(), 'Upload ZIP in repository root'
          required={'src/assets/savana-site-preview-2026.webp','apply_savana_preview.py'}
          with zipfile.ZipFile(archive) as z:
              assert set(z.namelist())==required, 'Invalid file list'
              assert z.testzip() is None, 'Corrupt ZIP'
              assert all('..' not in Path(n).parts and not n.startswith('/') for n in z.namelist()), 'Unsafe ZIP path'
              z.extractall('.')
          assert Path('src/assets/savana-site-preview-2026.webp').read_bytes()[:4]==b'RIFF', 'Invalid WebP'
          PY
      - name: Update only preview asset import
        run: python3 apply_savana_preview.py
      - name: Production build
        run: |
          bun install --frozen-lockfile
          bun run build
          grep -Fq 'import savanaSitePreview from "@/assets/savana-site-preview-2026.webp"' src/routes/index.tsx
          grep -Fq 'viewHref: "https://www.savanadivik.ru/"' src/routes/index.tsx
          test "$(grep -c '<loc>' public/sitemap.xml)" -eq 16
      - name: Commit change and delete temporary installer
        run: |
          rm apply_savana_preview.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f Vikey_Savana_Preview_Update.zip
          git rm -f .github/workflows/vikey-savana-preview-install-temp.yml
          git add src/routes/index.tsx src/assets/savana-site-preview-2026.webp
          git commit -m "Refresh Savana portfolio preview with current site screenshot"
          git push origin HEAD:main
