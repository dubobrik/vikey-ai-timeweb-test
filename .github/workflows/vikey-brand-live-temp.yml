name: Temporary strict personal brand live audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vikey-brand-live-temp.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary Playwright
        id: install
        continue-on-error: true
        run: |
          npm install --prefix /tmp/vikey-brand-audit --no-save playwright
          /tmp/vikey-brand-audit/node_modules/.bin/playwright install --with-deps chromium
      - name: Check audit script syntax
        id: syntax
        continue-on-error: true
        run: node --check .github/vikey-brand-live-temp.cjs
      - name: Run strict live audit
        id: audit
        if: steps.install.outcome == 'success' && steps.syntax.outcome == 'success'
        continue-on-error: true
        env:
          NODE_PATH: /tmp/vikey-brand-audit/node_modules
        run: node .github/vikey-brand-live-temp.cjs
      - name: Save temporary report
        if: always()
        run: |
          if [ ! -f .github/vikey-brand-live-report-temp.json ]; then
            printf '{"passed":false,"errors":["Audit produced no report"],"checks":{},"devices":{}}\n' > .github/vikey-brand-live-report-temp.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/vikey-brand-live-report-temp.json
          if ! git diff --cached --quiet; then
            git commit -m "Temporary personal brand live audit results"
            git push origin HEAD:main
          fi
      - name: Fail if any mandatory check failed
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.syntax.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
          node -e "const r=require('./.github/vikey-brand-live-report-temp.json');if(!r.passed)process.exit(1)"
