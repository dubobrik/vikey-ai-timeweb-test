name: Final Lovable cleanup

on:
  push:
    paths:
      - ".github/workflows/final-lovable-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Remove obsolete Lovable metadata and migration helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f src/assets/*.asset.json
          rm -f .github/workflows/localize-lovable-images.yml
          rm -f .github/workflows/localize-avatar-video.yml
          rm -f .github/workflows/remove-lovable-runtime.yml
          rm -f .github/workflows/final-lovable-cleanup.yml

      - name: Verify independent production build
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build

      - name: Verify no technical Lovable references remain
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIniE '@lovable\.dev|/__l5e/|lovable-error-reporting|\.asset\.json|__lovable' \
            --exclude-dir=.git \
            --exclude='BUILD_LOG.txt' \
            --exclude='BUILD_CHECK.txt' .; then
            echo "Technical Lovable references still remain."
            exit 1
          fi
          printf "Lovable cleanup: OK\nIndependent build: OK\n" > CLEANUP_CHECK.txt

      - name: Commit final cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Lovable cleanup"
          git push
